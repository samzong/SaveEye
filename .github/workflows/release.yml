name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Verify SemVer tag and tracked Info.plist
        id: version
        run: |
          set -euo pipefail
          python3 .github/scripts/check-release-tag.py "$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"

      - name: Build and test
        run: |
          xcodebuild test -scheme SaveEye -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Build packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: make dmg-unsigned VERSION="$VERSION"

      - name: Verify package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CORE: ${{ steps.version.outputs.core }}
          BUILD: ${{ steps.version.outputs.build }}
        run: bash .github/scripts/verify-package.sh "$VERSION" "$CORE" "$BUILD"

      - name: Generate release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 .github/scripts/release-notes.py "$VERSION" release_notes.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: SaveEye ${{ env.RELEASE_TAG }}
          body_path: release_notes.txt
          files: build/Release/SaveEye-${{ steps.version.outputs.version }}-arm64.dmg
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ steps.version.outputs.is_prerelease == 'true' }}
          make_latest: ${{ steps.version.outputs.make_latest }}
